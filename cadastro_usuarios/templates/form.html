{% extends 'base.html' %}

{% block content %}
<main>
    <div class="container">
        <h1>Formulário de cadastro de usuário</h1>
        <hr>
        <form action="{% url 'form' %}" method="POST" class="mt-5">
            {% csrf_token %}
            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" name="nome" aria-label="nome" required>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" class="form-control" name="cpf" aria-label="cpf" required>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" name="email" aria-label="email" required>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="genero" class="form-label">Gênero:</label>
                    <select class="form-select" name="genero" aria-label="genero">
                        <option value="" selected>Escolha uma opção...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </div>
        </form>
    </div>
</main>
{% endblock %}
